<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoyTap · Staff Scanner</title>
  <script>try{if(localStorage.getItem("loytap_staff")!=="1")location.replace("auth.html");}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="staff.css?v=2" />
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="stain stain--1"></span><span class="stain stain--2"></span></div>

  <main class="staff">
    <header class="staff-head">
      <h1 class="staff-title">LoyTap <span>· Staff</span></h1>
      <p class="staff-sub">Scan a customer's discount QR to redeem it</p>
    </header>

    <!-- Scanner -->
    <div class="scanner" id="scanner">
      <video class="scanner__video" id="video" playsinline muted></video>
      <div class="scanner__frame" aria-hidden="true"><span class="scanner__line"></span></div>
      <div class="scanner__idle" id="scannerIdle">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/>
          <rect x="8" y="8" width="8" height="8" rx="1"/>
        </svg>
        <p>Camera off</p>
      </div>
    </div>
    <button class="btn btn--primary" id="scanBtn" type="button">Start scanning</button>
    <p class="scanner__note" id="scannerNote"></p>

    <!-- Manual fallback -->
    <div class="manual">
      <span class="manual__or">or enter code</span>
      <form class="manual__row" id="manualForm">
        <input class="manual__input" id="manualInput" type="text" inputmode="text" autocapitalize="characters"
               autocomplete="off" placeholder="e.g. AURORA20" />
        <button class="btn btn--ghost" type="submit">Check</button>
      </form>
    </div>
  </main>

  <!-- Result modal -->
  <div class="result" id="result" hidden aria-hidden="true">
    <div class="result__scrim" id="resultScrim"></div>
    <div class="result__card" id="resultCard" role="dialog" aria-label="Discount result">
      <div class="result__icon" id="resultIcon"></div>
      <p class="result__status" id="resultStatus"></p>
      <div class="result__body" id="resultBody"></div>
      <div class="result__actions" id="resultActions"></div>
    </div>
  </div>

  <script src="jsQR.js"></script>
  <script src="staff.js?v=2"></script>
</body>
</html>
