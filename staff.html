<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>Oram · Staff Scanner</title>
  <script src="staff.guard.js?v=3"></script>
  <link rel="manifest" href="/manifest-staff.json" />
  <link rel="icon" href="reloy-icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Reloy Staff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="staff.css?v=15" />
  <script src="i18n.js?v=38"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="stain stain--1"></span><span class="stain stain--2"></span><span class="grain"></span></div>

  <button class="staff-signout" id="signoutBtn" type="button" aria-label="Sign out" title="Sign out" data-i18n-aria="WALLET_SIGNOUT" data-i18n-title="WALLET_SIGNOUT">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <path d="M16 17l5-5-5-5"/>
      <path d="M21 12H9"/>
    </svg>
  </button>

  <main class="staff">
    <header class="staff-head">
      <h1 class="staff-title" id="cafeName">Oram Cafe &amp; Restaurant</h1>
    </header>

    <!-- ===== Tab 1: Scan ===== -->
    <section class="panel" id="panelScan">

    <!-- Incoming stamp-tap requests — real-time, no refresh. Stays on THIS
         panel rather than getting its own tab: it is realtime and time-
         sensitive, and the scan tab is where staff already are. The tab
         badge covers the case where they are on the other tab. -->
    <div class="request-queue" id="requestQueue" aria-live="polite"></div>

    <div class="staff-card">
      <!-- Scanner -->
      <div class="scan-shell">
        <div class="scanner" id="scanner">
          <video class="scanner__video" id="video" playsinline muted></video>
          <div class="scanner__frame" aria-hidden="true">
            <span class="scanner__corner tl"></span><span class="scanner__corner tr"></span>
            <span class="scanner__corner bl"></span><span class="scanner__corner br"></span>
            <span class="scanner__line"></span>
          </div>
          <div class="scanner__idle" id="scannerIdle">
            <div class="scanner__idle-ring">
              <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/>
                <rect x="8" y="8" width="8" height="8" rx="1"/>
              </svg>
            </div>
            <p data-i18n="STAFF_IDLE_TITLE">Ready to scan</p>
            <span data-i18n="STAFF_IDLE_SUB">Point the camera at a customer's QR</span>
          </div>
        </div>
      </div>

      <button class="btn btn--primary scan-cta" id="scanBtn" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/></svg>
        <span data-i18n="STAFF_BTN_START">Start scanning</span>
      </button>
      <p class="scanner__note" id="scannerNote"></p>

      <!-- Manual fallback -->
      <div class="manual">
        <div class="manual__divider"><span data-i18n="STAFF_MANUAL_DIVIDER">or enter the code</span></div>
        <form class="manual__row" id="manualForm">
          <input class="manual__input" id="manualInput" type="text" inputmode="text" autocapitalize="characters"
                 autocomplete="off" placeholder="e.g. LOY4N4384" data-i18n-placeholder="STAFF_MANUAL_PLACEHOLDER" />
          <button class="btn btn--ghost" type="submit" data-i18n="STAFF_BTN_CHECK">Check</button>
        </form>
      </div>
    </div>

    </section><!-- /panelScan -->

    <!-- ===== Tab 2: placeholder =====
         Structure only, waiting on what this tab should actually hold. To
         fill it: drop the content inside, then change the label string and
         the <svg> in #tabTwo below. Nothing else needs touching — the bar,
         the indicator and the switching already work. -->
    <section class="panel" id="panelTwo" hidden>
      <div class="staff-card panel-soon">
        <p class="panel-soon__title" data-i18n="STAFF_TAB_TWO">Coming soon</p>
        <p class="panel-soon__sub" data-i18n="STAFF_TAB_TWO_SUB">This tab is ready and waiting for its content.</p>
      </div>
    </section>
  </main>

  <!-- Result modal -->
  <div class="result" id="result" hidden aria-hidden="true">
    <div class="result__scrim" id="resultScrim"></div>
    <div class="result__card" id="resultCard" role="dialog" aria-label="Discount result" data-i18n-aria="STAFF_RESULT_ARIA">
      <div class="result__icon" id="resultIcon"></div>
      <p class="result__status" id="resultStatus"></p>
      <div class="result__body" id="resultBody"></div>
      <div class="result__actions" id="resultActions"></div>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" style="--ti:0" aria-label="Primary">
    <span class="tabbar__ind" aria-hidden="true"></span>
    <button class="tab is-active" id="tabScan" type="button" aria-label="Scan" data-i18n-aria="STAFF_TAB_SCAN">
      <span class="tab__ico">
        <!-- the same viewfinder mark the idle scanner and the start button
             already use, so the tab reads as the thing it opens -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/></svg>
        <span class="tab__badge" id="scanBadge" hidden>0</span>
      </span>
      <span class="tab__label" data-i18n="STAFF_TAB_SCAN">Scan</span>
    </button>
    <button class="tab" id="tabTwo" type="button" aria-label="Coming soon" data-i18n-aria="STAFF_TAB_TWO">
      <span class="tab__ico">
        <!-- placeholder mark — swap with the real one -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4l2.5 2.5"/></svg>
      </span>
      <span class="tab__label" data-i18n="STAFF_TAB_TWO">Soon</span>
    </button>
  </nav>

  <script src="staff.page.js?v=4"></script>
  <script src="jsQR.js"></script>
  <script src="staff.js?v=13"></script>
</body>
</html>
