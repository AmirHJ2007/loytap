<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>Reloy · Analytics</title>
  <script>try{if(localStorage.getItem('loytap_owner')!=='1')location.replace('auth.html');}catch(e){}</script>
  <link rel="stylesheet" href="fonts.css" />
  <script src="i18n.js"></script>
  <style>
    :root {
      --ink:#171717; --dim:#565656; --faint:#9a9a9a; --line:#cccccc;
      --paper:#f0f0f0; --paper2:#e2e2e2; --bad:#c0503f;
      --ease-spring: cubic-bezier(0.34, 1.4, 0.5, 1);
      --glass-fill: rgba(255,255,255,0.34); --glass-fill-strong: rgba(255,255,255,0.55);
      --glass-border: rgba(255,255,255,0.7); --glass-hi: rgba(255,255,255,0.9);
      --glass-shadow: 0 34px 70px -28px rgba(20,20,20,0.5);
      --font-heading: "Quicksand", sans-serif;
      --font-body: "Nunito", system-ui, sans-serif;
    }
    html[dir="rtl"] {
      --font-heading: "Vazirmatn", "Quicksand", sans-serif;
      --font-body: "Vazirmatn", "Nunito", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-body); color: var(--ink);
      background: linear-gradient(165deg, #f5f5f5 0%, #e6e6e6 46%, #d2d2d2 100%);
      min-height: 100dvh; -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }

    /* ---------------- Aurora background ---------------- */
    .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .bg::before, .bg::after { content: ""; position: absolute; border-radius: 50%; filter: blur(72px); opacity: 0.6; will-change: transform; }
    .bg::before { width: 52vmax; height: 52vmax; top: -16vmax; right: -12vmax; background: radial-gradient(circle at 50% 50%, #c4c4c4, transparent 66%); animation: orbA 34s ease-in-out infinite; }
    .bg::after { width: 46vmax; height: 46vmax; bottom: -18vmax; left: -14vmax; background: radial-gradient(circle at 50% 50%, #3a3a3a, transparent 64%); animation: orbB 40s ease-in-out infinite; }
    .stain { position: absolute; border-radius: 50%; filter: blur(66px); opacity: 0.5; will-change: transform; }
    .stain--1 { width: 46vmax; height: 46vmax; top: -10vmax; left: -8vmax; background: radial-gradient(circle at 42% 40%, #d8d8d8, transparent 66%); animation: float1 28s ease-in-out infinite; }
    .stain--2 { width: 42vmax; height: 42vmax; bottom: -12vmax; right: 8vmax; background: radial-gradient(circle at 50% 50%, #808080, transparent 66%); animation: float2 32s ease-in-out infinite; }
    @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(10vmax,6vmax) scale(1.12); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1.05); } 50% { transform: translate(-8vmax,-5vmax) scale(0.94); } }
    @keyframes orbA  { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-9vmax,7vmax) scale(1.14); } }
    @keyframes orbB  { 0%,100% { transform: translate(0,0) scale(1.06); } 50% { transform: translate(7vmax,-6vmax) scale(0.92); } }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .wrap { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 20px 18px 48px; }

    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; animation: fadeDown 0.6s var(--ease-spring) both; }
    .back {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none; cursor: pointer;
      color: var(--dim); font-family: var(--font-heading); font-weight: 700; font-size: 13px; border-radius: 12px; padding: 8px 13px;
      background: rgba(255,255,255,0.4); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.5);
      transition: color 0.2s ease, background 0.2s ease;
    }
    .back:hover { color: var(--ink); background: rgba(255,255,255,0.6); }
    .signout {
      color: var(--bad); font-family: var(--font-heading); font-weight: 700; font-size: 13px; border-radius: 12px; padding: 8px 13px; cursor: pointer;
      background: linear-gradient(155deg, rgba(253,241,238,0.55), rgba(247,221,214,0.42));
      backdrop-filter: blur(8px); border: 1px solid rgba(192,80,63,0.28);
      transition: background 0.2s ease;
    }
    .signout:hover { background: linear-gradient(155deg, rgba(253,241,238,0.72), rgba(247,221,214,0.58)); }

    .head { margin: 12px 2px 18px; animation: fadeUp 0.6s var(--ease-spring) 0.08s both; }
    .head h1 {
      font-family: var(--font-heading); font-weight: 700; font-size: 26px; margin: 0; letter-spacing: -0.4px;
      background: linear-gradient(100deg, #171717 0%, #171717 40%, #9a8248 50%, #171717 60%, #171717 100%);
      background-size: 220% 100%; background-position: 200% 0;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: headShimmer 2.3s ease 0.5s 2;
    }
    @keyframes headShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .head p { margin: 3px 0 0; font-size: 14px; color: var(--dim); }

    .loading { text-align: center; color: var(--faint); font-size: 14px; padding: 60px 0; }
    .empty { text-align: center; color: var(--faint); font-size: 13.5px; line-height: 1.6; padding: 30px 16px; }

    /* ---------------- Shared glass surface ---------------- */
    .glass {
      background: linear-gradient(158deg, var(--glass-fill-strong), var(--glass-fill));
      backdrop-filter: blur(20px) saturate(165%); -webkit-backdrop-filter: blur(20px) saturate(165%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi), inset 0 0 0 1px rgba(255,255,255,0.22);
    }

    /* section cards — frosted glass, revealed on scroll */
    /* analytics cards stay laid out like the English version — charts/bars/legends keep
       their geometry, only the prose (titles, tooltips, captions) reads RTL */
    .card { border-radius: 20px; padding: 18px; margin-bottom: 16px; opacity: 0; transform: translateY(28px) scale(0.985); transition: opacity 0.6s var(--ease-spring), transform 0.6s var(--ease-spring), box-shadow 0.3s ease; direction: ltr; }
    html[dir="rtl"] .card__title, html[dir="rtl"] .card__sub, html[dir="rtl"] .cb-info,
    html[dir="rtl"] .empty, html[dir="rtl"] .act-cmp, html[dir="rtl"] .cb-cap,
    html[dir="rtl"] .hm-ex, html[dir="rtl"] .ru-hero__txt, html[dir="rtl"] .cb-today__k,
    html[dir="rtl"] .act-sel__head b, html[dir="rtl"] .ar-sub {
      direction: rtl; text-align: right;
    }
    /* wraps a translated phrase (often with embedded numbers) sitting inline next to
       other LTR-locked content, so its own bidi run resolves correctly */
    html[dir="rtl"] .i18n-rtl { direction: rtl; unicode-bidi: isolate; }
    /* number-then-word pairs (cb-today__v, ar-legend/nl-legend items, nl-v) sit as plain
       LTR-ordered siblings, which reads backwards for an RTL scanner (word, then number).
       Flipping the pair's own direction puts the number first, matching Persian reading order. */
    html[dir="rtl"] .cb-today__v, html[dir="rtl"] .ar-legend > span,
    html[dir="rtl"] .nl-legend > span, html[dir="rtl"] .nl-v {
      direction: rtl;
    }
    .card.in { opacity: 1; transform: none; }
    .card.in:hover { transform: translateY(-4px); box-shadow: var(--glass-shadow), 0 32px 52px -26px rgba(20,20,20,0.55), inset 0 1px 0 var(--glass-hi); }
    .card__title { font-family: var(--font-heading); font-weight: 700; font-size: 16px; margin: 0 0 2px; }
    .card__sub { margin: 0 0 14px; font-size: 12px; color: var(--dim); }

    .donut { width: 132px; height: 132px; }
    .donut__num { font-family: var(--font-heading); font-weight: 700; font-size: 26px; fill: var(--ink); }
    .donut__sub { font-size: 9px; font-weight: 700; letter-spacing: 1px; fill: var(--faint); text-transform: uppercase; }
    /* ring fills, line charts draw, bars grow, heatmap settles — all keyed off .card.in */
    .donut__val { transition: stroke-dashoffset 1.1s var(--ease-spring) 0.15s; }
    .card.in .donut__val { stroke-dashoffset: 0 !important; }
    .chart-line { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .card.in .chart-line { stroke-dashoffset: 0; transition: stroke-dashoffset 1.25s ease 0.2s; }
    .chart-area { opacity: 0; transition: opacity 0.7s ease 0.5s; }
    .card.in .chart-area { opacity: 1; }
    .ru-row__fill, .ar-bar__fill, .nl-bar__seg { transform: scaleX(0); transform-origin: left center; transition: transform 0.9s var(--ease-spring) 0.2s; }
    .card.in .ru-row__fill, .card.in .ar-bar__fill, .card.in .nl-bar__seg { transform: scaleX(1); }
    .hm { opacity: 0; transform: scale(0.95); transition: opacity 0.5s ease 0.15s, transform 0.5s var(--ease-spring) 0.15s; }
    .card.in .hm { opacity: 1; transform: none; }

    /* reward used rate — hero ring + per-reward percentage bars */
    .ru-hero { display: flex; align-items: center; gap: 16px; margin-bottom: 6px; }
    .ru-hero .donut { width: 116px; height: 116px; flex: 0 0 auto; }
    .ru-hero__txt { font-size: 13.5px; line-height: 1.5; color: var(--dim); }
    .ru-hero__txt b { font-family: var(--font-heading); font-weight: 700; font-size: 18px; color: var(--ink); display: block; margin-bottom: 3px; }
    .ru-list { display: flex; flex-direction: column; gap: 13px; margin-top: 10px; }
    .ru-row__top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; gap: 8px; }
    .ru-row__label { font-family: var(--font-heading); font-weight: 700; font-size: 14px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ru-row__val { flex: 0 0 auto; font-size: 12px; font-weight: 700; color: var(--dim); }
    .ru-row__track { position: relative; height: 12px; border-radius: 8px; background: rgba(20,20,20,0.08); overflow: hidden; }
    .ru-row__fill { position: absolute; inset: 0 auto 0 0; height: 100%; background: #171717; border-radius: 8px; min-width: 2px; }

    /* daily stamp activity */
    .act-toggle { display: inline-flex; background: rgba(20,20,20,0.07); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 14px; }
    html[dir="rtl"] .act-toggle { display: flex; width: fit-content; margin-left: auto; }
    .act-toggle button { border: none; background: transparent; font-family: var(--font-heading); font-weight: 700; font-size: 13px; color: var(--dim); padding: 7px 15px; border-radius: 9px; cursor: pointer; }
    html[dir="rtl"] .act-toggle button { direction: rtl; }
    .act-toggle button.is-on { background: #fff; color: var(--ink); box-shadow: 0 3px 8px -4px rgba(20,20,20,0.35); }
    /* selected-day box — a small stat-tile group, stamps emphasised */
    .act-sel { background: linear-gradient(158deg, rgba(255,255,255,0.62), rgba(255,255,255,0.34)); border: 1px solid var(--glass-border); border-radius: 16px; padding: 14px 15px; margin-bottom: 16px; box-shadow: inset 0 1px 0 var(--glass-hi); }
    .act-sel__head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .act-sel__head b { font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--ink); }
    .act-sel__dot { width: 9px; height: 9px; border-radius: 50%; background: #171717; flex: 0 0 auto; }
    .act-sel__tag { margin-left: auto; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; color: var(--faint); background: rgba(20,20,20,0.06); padding: 3px 9px; border-radius: 999px; }
    .act-sel__stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .act-sel__stat { text-align: center; background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.5); border-radius: 12px; padding: 11px 6px; }
    .act-sel__stat b { display: block; font-family: var(--font-heading); font-weight: 700; font-size: 24px; line-height: 1; color: var(--ink); }
    .act-sel__stat span { display: block; margin-top: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--dim); }
    .act-sel__stat i { display: block; margin-top: 6px; font-style: normal; font-size: 10px; font-weight: 700; color: var(--faint); }
    .act-sel__stat--hero { background: #171717; border-color: #171717; }
    .act-sel__stat--hero b { color: #fff; }
    .act-sel__stat--hero span { color: rgba(255,255,255,0.65); }
    .act-sel__stat--hero i { color: rgba(255,255,255,0.5); }
    /* period totals — black box, now below the chart */
    .act-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #171717; color: #ffffff; border-radius: 16px; padding: 16px 18px; margin: 18px 0 10px; }
    html[dir="rtl"] .act-stats { direction: ltr; text-align: right; }
    .act-stats b { display: block; font-family: var(--font-heading); font-weight: 700; font-size: 28px; line-height: 1; }
    .act-stats span { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 3px; display: block; }
    .act-cmp { margin: 0 2px; font-size: 13px; font-weight: 700; }
    .act-cmp.up { color: var(--ink); } .act-cmp.down { color: var(--bad); } .act-cmp.flat { color: var(--faint); }
    .act-chart { position: relative; padding-top: 14px; }
    .act-ymax { position: absolute; top: 0; left: 0; font-size: 9.5px; font-weight: 700; color: var(--faint); }
    .act-bars { display: flex; align-items: flex-end; gap: 3px; height: 150px; }
    .act-bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; background: none; border: none; padding: 0; cursor: pointer; }
    .act-bar__fill { width: 80%; min-height: 3px; border-radius: 6px 6px 2px 2px; background: rgba(20,20,20,0.18); transition: height 0.3s ease, background 0.2s ease; }
    .act-bar:hover .act-bar__fill { background: rgba(20,20,20,0.32); }
    .act-bar.is-sel .act-bar__fill { background: #171717; }
    .act-bar__lab { font-size: 9px; font-weight: 700; color: var(--faint); white-space: nowrap; }
    .act-bar.is-sel .act-bar__lab { color: var(--ink); }

    /* comeback rate section */
    .info-btn { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-left: 5px; vertical-align: middle; border-radius: 50%; border: 1.5px solid rgba(20,20,20,0.28); background: transparent; color: var(--dim); font-family: var(--font-heading); font-weight: 700; font-size: 11px; font-style: italic; line-height: 1; cursor: pointer; padding: 0; transition: color 0.2s ease, border-color 0.2s ease; }
    .info-btn:hover { color: var(--ink); border-color: rgba(20,20,20,0.5); }
    .cb-info { background: rgba(20,20,20,0.05); border-radius: 12px; padding: 11px 13px; font-size: 12.5px; line-height: 1.55; color: var(--dim); margin: 2px 0 12px; }
    .cb-info b { color: var(--ink); }
    .cb-today { display: flex; align-items: center; gap: 14px; margin: 4px 0 12px; }
    html[dir="rtl"] .cb-today { justify-content: flex-end; }
    .cb-today__v { font-family: var(--font-heading); font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: -1.2px; color: var(--ink); }
    .cb-today__u { font-size: 18px; font-weight: 700; letter-spacing: 0; color: var(--dim); margin-left: 5px; }
    .cb-today__k { font-size: 12px; font-weight: 700; color: var(--dim); }
    .cb-today__k span { display: block; font-weight: 600; color: var(--faint); margin-top: 3px; }
    .cb-chart { margin-top: 4px; }
    .cb-chart svg { width: 100%; height: auto; display: block; overflow: visible; }
    .cb-hit { cursor: pointer; }
    .cb-cap { text-align: center; font-size: 11.5px; color: var(--dim); font-weight: 600; margin: 8px 0 0; }
    .cb-cap b { color: var(--ink); }

    /* active rate section */
    .ar-top { display: flex; align-items: center; gap: 12px; margin: 4px 0 4px; }
    .ar-v { font-family: var(--font-heading); font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: -1.2px; color: var(--ink); }
    .ar-delta { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    .ar-delta svg { width: 12px; height: 12px; }
    .ar-delta.up { color: #137a43; background: rgba(31,157,91,0.15); }
    .ar-delta.down { color: #c0503f; background: rgba(192,80,63,0.15); }
    .ar-delta.flat { color: var(--faint); background: rgba(20,20,20,0.06); }
    .ar-sub { font-size: 12px; color: var(--faint); font-weight: 700; margin: 0 0 14px; }
    .ar-bar { position: relative; height: 34px; border-radius: 12px; background: rgba(20,20,20,0.09); overflow: hidden; }
    .ar-bar__fill { position: absolute; inset: 0 auto 0 0; height: 100%; background: #171717; border-radius: 12px; min-width: 3px; }
    .ar-legend { display: flex; justify-content: space-between; align-items: baseline; margin-top: 9px; font-size: 12px; font-weight: 700; color: var(--dim); }
    .ar-legend b { font-family: var(--font-heading); font-size: 15px; color: var(--ink); margin-right: 3px; }
    .ar-legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .ar-legend .dot--on { background: #171717; }
    .ar-legend .dot--all { background: rgba(20,20,20,0.18); }

    /* new vs loyal split bar */
    .nl-top { display: flex; align-items: baseline; gap: 8px; margin: 4px 0 12px; }
    .nl-v { font-family: var(--font-heading); font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: -1.2px; color: var(--ink); }
    .nl-v span { font-size: 18px; font-weight: 700; color: var(--dim); margin-left: 5px; letter-spacing: 0; }
    .nl-bar { display: flex; height: 34px; border-radius: 12px; overflow: hidden; background: rgba(20,20,20,0.09); }
    .nl-bar__seg { height: 100%; }
    .nl-bar__seg--new { background: #171717; }
    .nl-bar__seg--loyal { background: #c2c2c2; }
    .nl-legend { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--dim); }
    .nl-legend b { font-family: var(--font-heading); font-size: 15px; color: var(--ink); margin-right: 3px; }
    .nl-legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .nl-legend .dot--new { background: #171717; }
    .nl-legend .dot--loyal { background: #c2c2c2; }

    /* crowded-times heatmap */
    .hm { display: grid; grid-template-columns: 30px repeat(6, 1fr); gap: 4px; }
    .hm__corner { }
    .hm__sl { font-size: 8px; font-weight: 700; color: var(--faint); text-align: center; align-self: end; padding-bottom: 3px; white-space: nowrap; }
    .hm__dl { font-size: 10px; font-weight: 700; color: var(--dim); display: flex; align-items: center; }
    .hm__cell { height: 30px; border: none; border-radius: 7px; cursor: pointer; padding: 0; background: rgba(20,20,20,0.045); transition: transform 0.1s ease, box-shadow 0.15s ease; }
    .hm__cell:hover { transform: scale(1.08); }
    .hm__cell.is-sel { box-shadow: 0 0 0 2px #171717, 0 0 0 4px rgba(255,255,255,0.7); }
    .hm-extremes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .hm-ex { background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.5); border-radius: 13px; padding: 11px 13px; }
    .hm-ex span { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--faint); margin-bottom: 4px; }
    .hm-ex b { font-family: var(--font-heading); font-weight: 700; font-size: 15px; color: var(--ink); }
    .hm-ex i { font-style: normal; color: var(--dim); font-size: 12px; font-weight: 700; }

    @media (prefers-reduced-motion: reduce) {
      .bg::before, .bg::after, .stain { animation: none; }
      .top, .head, .card { animation: none; opacity: 1; transform: none; }
      .head h1 { background: none; color: var(--ink); -webkit-text-fill-color: var(--ink); }
      .chart-line { stroke-dashoffset: 0; }
      .donut__val { stroke-dashoffset: 0 !important; }
      .chart-area, .hm { opacity: 1; transform: none; }
      .ru-row__fill, .ar-bar__fill, .nl-bar__seg { transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="stain stain--1"></span><span class="stain stain--2"></span></div>

  <main class="wrap">
    <div class="top">
      <a class="back" href="owner.html">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span data-i18n="AN_BACK">Back</span>
      </a>
      <button class="signout" id="signout" type="button" data-i18n="WALLET_SIGNOUT">Sign out</button>
    </div>
    <div class="head">
      <h1 data-i18n="AN_TITLE">Analytics</h1>
      <p id="cafeName">your café</p>
    </div>

    <div id="content"><p class="loading" data-i18n="AN_LOADING">Loading your numbers…</p></div>
  </main>

  <script>
    applyI18n();
    const API = location.port === "8000" ? location.protocol + "//" + location.hostname + ":8090" : location.origin;
    const token = (function () { try { return localStorage.getItem("loytap_token") || ""; } catch (e) { return ""; } })();
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const plural1 = (n, one, many) => t(n === 1 ? one : many);
    const stampWord = (n) => plural1(n, "AN_STAMP_LC_ONE", "AN_STAMP_LC_MANY");
    // backend sends English 3-letter weekday abbreviations (dow / days / the leading
    // token of "label" strings like "Mon 31 Aug") — translate just that token client-side.
    const DOW_KEYS = { Sun: "DOW_SUN", Mon: "DOW_MON", Tue: "DOW_TUE", Wed: "DOW_WED", Thu: "DOW_THU", Fri: "DOW_FRI", Sat: "DOW_SAT" };
    const dow = (abbr) => (DOW_KEYS[abbr] ? t(DOW_KEYS[abbr]) : abbr);
    const translateLabel = (label) => {
      const sp = String(label).indexOf(" ");
      if (sp < 0) return label;
      const head = label.slice(0, sp);
      return DOW_KEYS[head] ? dow(head) + label.slice(sp) : label;
    };

    try { $("cafeName").textContent = t("OWNER_CAFE_FALLBACK"); } catch (e) {}

    $("signout").onclick = () => {
      ["loytap_token","loytap_owner","loytap_staff","loytap_role","loytap_signed_in","loytap_name","loytap_cafe"]
        .forEach((k) => { try { localStorage.removeItem(k); } catch (e) {} });
      location.replace("auth.html");
    };

    // ---- SVG donut helper (single-value ring, monochrome) ----
    function ring(pct, sub) {
      const r = 52, c = 2 * Math.PI * r, on = Math.max(0, Math.min(100, pct)) / 100 * c;
      return `<svg viewBox="0 0 130 130" class="donut">
        <circle cx="65" cy="65" r="${r}" fill="none" stroke="rgba(20,20,20,0.08)" stroke-width="14"/>
        <circle class="donut__val" cx="65" cy="65" r="${r}" fill="none" stroke="#171717" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="${on.toFixed(1)} ${(c - on).toFixed(1)}" stroke-dashoffset="${on.toFixed(1)}" transform="rotate(-90 65 65)"/>
        <text x="65" y="66" text-anchor="middle" class="donut__num count" data-count-to="${pct}" data-count-suffix="%">0%</text>
        <text x="65" y="84" text-anchor="middle" class="donut__sub">${esc(sub)}</text>
      </svg>`;
    }

    function render(d) {
      const tot = d.totals, r = d.rates;
      if (!tot.customers && !tot.issued) {
        $("content").innerHTML = `<div class="card glass"><p class="empty">${t("AN_EMPTY_HTML")}</p></div>`;
        return;
      }

      // reward used rate — per-reward redemption %, last 30 days
      const usedRate = r.redemption;                 // pct(redeemed30, issued30)
      const rewardBars = d.byDeal.length ? d.byDeal.map((x) => {
        const p = x.issued > 0 ? Math.round(x.redeemed / x.issued * 100) : 0;
        return `<div class="ru-row">
          <div class="ru-row__top"><span class="ru-row__label">${esc(x.deal)}</span><span class="ru-row__val i18n-rtl">${t("AN_RU_ROW_VAL", { redeemed: x.redeemed, issued: x.issued })}${x.issued > 0 ? t("WALLET_LIST_SEP") + p + "%" : ""}</span></div>
          <div class="ru-row__track"><div class="ru-row__fill" style="width:${x.issued > 0 ? Math.max(p, 2) : 0}%"></div></div>
        </div>`;
      }).join("") : `<p class="empty">${t("AN_RU_NO_REWARDS")}</p>`;

      $("content").innerHTML = `
        <div class="card glass" id="actCard"></div>

        <div class="card glass" id="cbCard"></div>

        <div class="card glass" id="arCard"></div>

        <div class="card glass" id="vrCard"></div>

        <div class="card glass" id="nlCard"></div>

        <div class="card glass" id="hmCard"></div>

        <div class="card glass" id="ruCard">
          <h2 class="card__title">${t("AN_RU_TITLE")} <button class="info-btn" type="button" aria-label="${t("AN_ARIA_INFO")}">i</button></h2>
          <p class="card__sub">${t("AN_RU_SUB")}</p>
          <div class="cb-info" hidden>
            ${t("AN_RU_INFO_HTML")}
          </div>
          <div class="ru-hero">
            ${ring(usedRate, t("AN_RU_RING_SUB"))}
            <div class="ru-hero__txt">${t("AN_RU_HERO_HTML", { redeemed: tot.redeemed30, issued: tot.issued30 })}</div>
          </div>
          <div class="ru-list">${rewardBars}</div>
        </div>`;

      if (d.comeback) setupComeback(d.comeback);
      if (d.visitRhythm) setupVisitRhythm(d.visitRhythm);
      if (d.activeRate) setupActiveRate(d.activeRate);
      if (d.newVsLoyal) setupNewVsLoyal(d.newVsLoyal);
      if (d.crowded) setupCrowded(d.crowded);
      if (d.activity) setupActivity(d.activity);

      const ruBtn = document.querySelector("#ruCard .info-btn");
      if (ruBtn) ruBtn.onclick = () => { const i = document.querySelector("#ruCard .cb-info"); i.hidden = !i.hidden; };

      revealCards();
    }

    // ---- entrance choreography: reveal cards on scroll + count up their numbers ----
    function countUp(el, to, dec, suf) {
      const dur = 950, t0 = performance.now();
      (function tick(now) {
        const p = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - p, 3); // easeOutCubic
        const v = to * e;
        el.textContent = (dec ? v.toFixed(dec) : Math.round(v)) + (suf || "");
        if (p < 1) requestAnimationFrame(tick);
      })(performance.now());
    }
    function runCounts(card, animate) {
      card.querySelectorAll("[data-count-to]").forEach((el) => {
        const to = parseFloat(el.dataset.countTo) || 0;
        const dec = parseInt(el.dataset.countDecimals || "0", 10);
        const suf = el.dataset.countSuffix || "";
        if (animate) countUp(el, to, dec, suf);
        else el.textContent = (dec ? to.toFixed(dec) : Math.round(to)) + suf;
      });
    }
    function revealCards() {
      const cards = Array.from(document.querySelectorAll("#content .card"));
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce || !("IntersectionObserver" in window)) {
        cards.forEach((c) => { c.classList.add("in"); runCounts(c, false); });
        return;
      }
      const io = new IntersectionObserver((entries, obs) => {
        entries.forEach((e) => {
          if (!e.isIntersecting) return;
          const el = e.target;
          el.classList.add("in");
          runCounts(el, true);
          setTimeout(() => { el.style.transitionDelay = ""; }, 750);
          obs.unobserve(el);
        });
      }, { threshold: 0.16, rootMargin: "0px 0px -6% 0px" });
      cards.forEach((c, i) => { c.style.transitionDelay = Math.min(i, 4) * 70 + "ms"; io.observe(c); });
    }

    // ---- crowded times: day × time-slot stamp heatmap ----
    function setupCrowded(c) {
      const card = $("hmCard");
      const max = c.max ? c.max.count : 0;
      const cellBg = (v) => (!max || v === 0) ? "rgba(20,20,20,0.045)" : `rgba(20,20,20,${(0.14 + 0.76 * (v / max)).toFixed(3)})`;
      const days = c.days.map(dow);

      let cells = `<div class="hm__corner"></div>` + c.slots.map((s) => `<div class="hm__sl">${esc(s)}</div>`).join("");
      c.grid.forEach((rowvals, r) => {
        cells += `<div class="hm__dl">${esc(days[r])}</div>`;
        cells += rowvals.map((v, s) =>
          `<button class="hm__cell" data-r="${r}" data-s="${s}" data-v="${v}" style="background:${cellBg(v)}" title="${esc(t("AN_HM_CELL_TITLE", { day: days[r], slot: c.slots[s], v, stampWord: stampWord(v) }))}"></button>`
        ).join("");
      });

      const ex = (o, kicker) => o
        ? `<div class="hm-ex"><span>${kicker}</span><b>${esc(dow(o.day))} · ${esc(o.slot)}</b><br><i>${o.count} ${stampWord(o.count)}</i></div>`
        : `<div class="hm-ex"><span>${kicker}</span><b>—</b></div>`;

      card.innerHTML = `
        <h2 class="card__title">${t("AN_HM_TITLE")} <button class="info-btn" type="button" aria-label="${t("AN_ARIA_INFO")}">i</button></h2>
        <p class="card__sub">${t("AN_HM_SUB", { days: c.windowDays })}</p>
        <div class="cb-info" hidden>
          ${t("AN_HM_INFO_HTML", { days: c.windowDays })}
        </div>
        <div class="hm">${cells}</div>
        <p class="cb-cap" id="hmCap">${max ? t("AN_HM_CAP_DEFAULT") : t("AN_HM_CAP_EMPTY", { days: c.windowDays })}</p>
        <div class="hm-extremes">${ex(c.max, t("AN_HM_BUSIEST"))}${ex(c.min, t("AN_HM_QUIETEST"))}</div>`;

      const info = card.querySelector(".cb-info");
      card.querySelector(".info-btn").onclick = () => { info.hidden = !info.hidden; };
      const cap = $("hmCap");
      let selEl = null;
      card.querySelectorAll(".hm__cell").forEach((el) => el.onclick = () => {
        if (selEl) selEl.classList.remove("is-sel");
        el.classList.add("is-sel"); selEl = el;
        const v = +el.dataset.v;
        cap.innerHTML = t("AN_HM_SEL_CAP_HTML", { day: esc(days[+el.dataset.r]), slot: esc(c.slots[+el.dataset.s]), v, stampWord: stampWord(v), days: c.windowDays });
      });
    }

    // ---- active rate: active-vs-all members bar + month-over-month arrow ----
    function setupActiveRate(ar) {
      const card = $("arCard");
      const up = ar.delta > 0, down = ar.delta < 0;
      const cls = up ? "up" : (down ? "down" : "flat");
      const arrow = up
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>`
        : down
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12l7 7 7-7"/></svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>`;
      const deltaTxt = (up ? "+" : down ? "−" : "") + Math.abs(ar.delta) + " " + t("AN_PTS");
      const fill = ar.total ? Math.max(3, (ar.active / ar.total) * 100) : 0;
      card.innerHTML = `
        <h2 class="card__title">${t("AN_AR_TITLE")} <button class="info-btn" type="button" aria-label="${t("AN_ARIA_INFO")}">i</button></h2>
        <p class="card__sub">${t("AN_AR_SUB", { days: ar.windowDays })}</p>
        <div class="cb-info" hidden>
          ${t("AN_AR_INFO_HTML", { days: ar.windowDays })}
        </div>
        <div class="ar-top">
          <div class="ar-v"><span class="count" data-count-to="${ar.rate}" data-count-suffix="%">0%</span></div>
          <span class="ar-delta ${cls}">${arrow}<span class="i18n-rtl">${cls === "flat" ? t("AN_NO_CHANGE") : deltaTxt}</span></span>
        </div>
        <p class="ar-sub">${cls === "flat" ? t("AN_SAME_AS") : (up ? t("AN_UP_FROM") : t("AN_DOWN_FROM"))} ${t("AN_A_MONTH_AGO", { rate: ar.prevRate })}</p>
        <div class="ar-bar"><div class="ar-bar__fill" style="width:${fill}%"></div></div>
        <div class="ar-legend">

          <span><span class="dot dot--all"></span><b>${ar.total}</b><span class="i18n-rtl">${t("AN_AR_LEGEND_TOTAL")}</span></span>
        </div>`;
      const info = card.querySelector(".cb-info");
      card.querySelector(".info-btn").onclick = () => { info.hidden = !info.hidden; };
    }

    // ---- new vs loyal: split of the last-30-day active base ----
    function setupNewVsLoyal(nl) {
      const card = $("nlCard");

      if (!nl.active) {
        body = `<p class="empty">${t("AN_NL_EMPTY", { days: nl.windowDays })}</p>`;

    // ---- comeback rate: today's number + a 14-day line chart ----
    function cbLineChart(series) {
      const W = 320, H = 132, padL = 6, padR = 6, padT = 10, padB = 20;
      const n = series.length, iw = W - padL - padR, ih = H - padT - padB;
      const X = (i) => padL + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
      const Y = (v) => padT + ih - (Math.max(0, Math.min(100, v)) / 100) * ih;
      const pts = series.map((s, i) => [X(i), Y(s.rate)]);
      const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      const area = path + " L" + X(n - 1).toFixed(1) + " " + (padT + ih).toFixed(1) + " L" + X(0).toFixed(1) + " " + (padT + ih).toFixed(1) + " Z";
      const grid = [0, 50, 100].map((v) => {
        const y = Y(v).toFixed(1);
        return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="rgba(20,20,20,0.08)" stroke-width="1"/>`
          + `<text x="${W - padR}" y="${(Y(v) - 3).toFixed(1)}" text-anchor="end" font-size="8.5" font-weight="700" fill="var(--faint)">${v}%</text>`;
      }).join("");
      const dots = pts.map((p, i) => {
        const last = i === n - 1;
        return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last ? 3.4 : 2}" fill="${last ? "#171717" : "rgba(20,20,20,0.55)"}"/>`
          + `<circle class="cb-hit" data-i="${i}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="11" fill="transparent"><title>${esc(series[i].label)}: ${series[i].rate}%</title></circle>`;
      }).join("");
      const xi = [0, Math.floor((n - 1) / 2), n - 1];
      const xlab = xi.map((i) =>
        `<text x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}" font-size="8.5" font-weight="700" fill="var(--faint)">${esc(series[i].label)}</text>`
      ).join("");
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Comeback rate, last 14 days">
        ${grid}
        <path class="chart-area" d="${area}" fill="rgba(20,20,20,0.07)"/>
        <path class="chart-line" pathLength="1" d="${path}" fill="none" stroke="#171717" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}${xlab}
      </svg>`;
    }

    function setupComeback(cb) {
      const card = $("cbCard");
      const s = cb.series || [];
      if (!s.length) { card.remove(); return; }
      const last = s[s.length - 1];
      card.innerHTML = `
        <h2 class="card__title">${t("AN_CB_TITLE")} <button class="info-btn" type="button" aria-label="${t("AN_ARIA_INFO")}">i</button></h2>
        <p class="card__sub">${t("AN_CB_SUB", { days: cb.windowDays })}</p>
        <div class="cb-info" hidden>
          ${t("AN_CB_INFO_HTML", { days: cb.windowDays })}
        </div>
        <div class="cb-today">
          <div class="cb-today__v"><span class="count" data-count-to="${last.rate}" data-count-suffix="%">0%</span></div>
          <div class="cb-today__k">${t("AN_TODAY_LAST_DAYS", { days: cb.windowDays })}<span>${t("AN_CB_RETURNERS", { returners: last.returners, newMembers: last.newMembers })}</span></div>
        </div>
        <div class="cb-chart">${cbLineChart(s)}</div>
        <p class="cb-cap" id="cbCap"></p>`;
      const info = card.querySelector(".cb-info");
      card.querySelector(".info-btn").onclick = () => { info.hidden = !info.hidden; };
      const cap = $("cbCap");
      const setCap = (i) => { const x = s[i]; cap.innerHTML = t("AN_CB_CAP_HTML", { days: cb.windowDays, label: esc(x.label), rate: x.rate, returners: x.returners, newMembers: x.newMembers }); };
      setCap(s.length - 1);
      card.querySelectorAll(".cb-hit").forEach((el) => el.onclick = () => setCap(+el.dataset.i));
    }

    // ---- visit rhythm: median gap between visits + a 14-day line chart ----
    function vrLineChart(series) {
      const vals = series.map((s) => s.value).filter((v) => v != null);
      if (!vals.length) return `<p class="empty">${t("AN_VR_NOT_ENOUGH")}</p>`;
      const W = 320, H = 132, padL = 6, padR = 6, padT = 10, padB = 20;
      const n = series.length, iw = W - padL - padR, ih = H - padT - padB;
      let maxV = Math.max(...vals); if (maxV <= 0) maxV = 1;
      const step = maxV <= 5 ? 1 : (maxV <= 10 ? 2 : (maxV <= 30 ? 5 : 10));
      const yMax = Math.max(step, Math.ceil(maxV / step) * step);
      const X = (i) => padL + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
      const Y = (v) => padT + ih - (Math.max(0, Math.min(yMax, v)) / yMax) * ih;
      let path = "", pen = false;
      series.forEach((s, i) => { if (s.value == null) { pen = false; return; } path += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(s.value).toFixed(1) + " "; pen = true; });
      const fmtY = (v) => (v % 1 ? v.toFixed(1) : v) + "d";
      const grid = [0, yMax / 2, yMax].map((v) => {
        const y = Y(v).toFixed(1);
        return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="rgba(20,20,20,0.08)" stroke-width="1"/>`
          + `<text x="${W - padR}" y="${(Y(v) - 3).toFixed(1)}" text-anchor="end" font-size="8.5" font-weight="700" fill="var(--faint)">${fmtY(v)}</text>`;
      }).join("");
      const dots = series.map((s, i) => {
        if (s.value == null) return "";
        const last = i === n - 1;
        return `<circle cx="${X(i).toFixed(1)}" cy="${Y(s.value).toFixed(1)}" r="${last ? 3.4 : 2}" fill="${last ? "#171717" : "rgba(20,20,20,0.55)"}"/>`
          + `<circle class="vr-hit" data-i="${i}" cx="${X(i).toFixed(1)}" cy="${Y(s.value).toFixed(1)}" r="11" fill="transparent"><title>${esc(s.label)}: ${s.value}d</title></circle>`;
      }).join("");
      const xi = [0, Math.floor((n - 1) / 2), n - 1];
      const xlab = xi.map((i) =>
        `<text x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}" font-size="8.5" font-weight="700" fill="var(--faint)">${esc(series[i].label)}</text>`
      ).join("");
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visit rhythm, last 14 days">
        ${grid}
        <path class="chart-line" pathLength="1" d="${path.trim()}" fill="none" stroke="#171717" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}${xlab}
      </svg>`;
    }

    function setupVisitRhythm(vr) {
      const card = $("vrCard");
      const s = vr.series || [];
      if (!s.length) { card.remove(); return; }
      const last = s[s.length - 1];
      const unit = (v) => plural1(v, "OWNER_UNIT_DAY", "OWNER_UNIT_DAYS");
      const customerWord = (n) => plural1(n, "AN_CUSTOMER_LC_ONE", "AN_CUSTOMER_LC_MANY");
      card.innerHTML = `
        <h2 class="card__title">${t("AN_VR_TITLE")} <button class="info-btn" type="button" aria-label="${t("AN_ARIA_INFO")}">i</button></h2>
        <p class="card__sub">${t("AN_VR_SUB", { days: vr.windowDays })}</p>
        <div class="cb-info" hidden>
          ${t("AN_VR_INFO_HTML", { days: vr.windowDays })}
        </div>
        <div class="cb-today">
          <div class="cb-today__v">${last.value == null ? "—" : `<span class="count" data-count-to="${last.value}" data-count-decimals="${Number.isInteger(last.value) ? 0 : 1}">0</span>`}${last.value == null ? "" : `<span class="cb-today__u">${unit(last.value)}</span>`}</div>
          <div class="cb-today__k">${t("AN_TODAY_LAST_DAYS", { days: vr.windowDays })}<span>${t("AN_VR_CUSTOMERS_MEASURED", { n: last.customers, customerWord: customerWord(last.customers) })}</span></div>
        </div>
        <div class="cb-chart">${vrLineChart(s)}</div>
        <p class="cb-cap" id="vrCap"></p>`;
      const info = card.querySelector(".cb-info");
      card.querySelector(".info-btn").onclick = () => { info.hidden = !info.hidden; };
      const cap = $("vrCap");
      const setCap = (i) => {
        const x = s[i];
        cap.innerHTML = x.value == null
          ? t("AN_VR_CAP_EMPTY_HTML", { days: vr.windowDays, label: esc(x.label) })
          : t("AN_VR_CAP_HTML", { days: vr.windowDays, label: esc(x.label), value: x.value, unit: unit(x.value), n: x.customers, customerWord: customerWord(x.customers) });
      };
      setCap(s.length - 1);
      card.querySelectorAll(".vr-hit").forEach((el) => el.onclick = () => setCap(+el.dataset.i));
    }

    // ---- interactive daily stamp activity card ----
    let ACT = null, actPeriod = 7, actSel = null, actInfoOpen = false;

    function activityCardHTML(data) {
      if (!actSel || !data.days.some((x) => x.date === actSel)) actSel = data.days[data.days.length - 1].date;
      const sel = data.days.find((x) => x.date === actSel) || { label: "—", stamps: 0, members: 0, rewards: 0 };
      let cmpCls = "flat", cmpTxt;
      if (data.prevStamps > 0) {
        const chg = Math.round((data.stamps - data.prevStamps) / data.prevStamps * 100);
        cmpCls = chg > 0 ? "up" : (chg < 0 ? "down" : "flat");
        cmpTxt = chg === 0
          ? t("AN_ACT_CMP_FLAT", { period: actPeriod })
          : t("AN_ACT_CMP_CHANGE", { pct: Math.abs(chg), period: actPeriod, dir: t(chg > 0 ? "AN_ACT_CMP_UP" : "AN_ACT_CMP_DOWN") });
      } else {
        cmpTxt = data.stamps > 0 ? t("AN_ACT_CMP_FIRST") : t("AN_ACT_CMP_NONE");
      }
      // daily mean of each metric over the last 30 days (always the 30-day window)
      const d30 = (ACT && ACT.d30 && ACT.d30.days) ? ACT.d30.days : [];
      const mean = (key) => d30.length ? Math.round(d30.reduce((a, x) => a + x[key], 0) / d30.length * 10) / 10 : 0;
      const mStamps = mean("stamps"), mMembers = mean("members"), mRewards = mean("rewards");
      const max = Math.max(1, ...data.days.map((x) => x.stamps));
      const bars = data.days.map((x, i) => {
        const h = (x.stamps / max * 100).toFixed(1);
        let lab = actPeriod === 7 ? dow(x.dow) : ((i % 5 === 0 || i === data.days.length - 1) ? x.date.slice(8) : "");
        return `<button class="act-bar${x.date === actSel ? " is-sel" : ""}" data-date="${x.date}" title="${esc(translateLabel(x.label))}"><span class="act-bar__fill" style="height:${h}%"></span><span class="act-bar__lab">${esc(lab)}</span></button>`;
      }).join("");
      return `
        <h2 class="card__title">${t("AN_ACT_TITLE")} <button class="info-btn" type="button" aria-label="${t("AN_ARIA_INFO")}">i</button></h2>
        <p class="card__sub">${t("AN_ACT_SUB")}</p>
        <div class="cb-info"${actInfoOpen ? "" : " hidden"}>
          ${t("AN_ACT_INFO_HTML")}
        </div>
        <div class="act-toggle">
          <button data-p="7" class="${actPeriod === 7 ? "is-on" : ""}">${t("AN_ACT_7DAYS")}</button>
          <button data-p="30" class="${actPeriod === 30 ? "is-on" : ""}">${t("AN_ACT_30DAYS")}</button>
        </div>
        <div class="act-sel">
          <div class="act-sel__head"><span class="act-sel__dot"></span><b>${esc(translateLabel(sel.label))}</b><span class="act-sel__tag">${t("AN_ACT_SELECTED_DAY")}</span></div>
          <div class="act-sel__stats">
            <div class="act-sel__stat act-sel__stat--hero"><b>${sel.stamps}</b><span>${plural1(sel.stamps, "AN_STAMP_ONE", "AN_STAMP_MANY")}</span><i class="i18n-rtl">${t("AN_30DAY_AVG", { n: mStamps })}</i></div>
            <div class="act-sel__stat"><b>${sel.members}</b><span>${plural1(sel.members, "AN_MEMBER_ONE", "AN_MEMBER_MANY")}</span><i class="i18n-rtl">${t("AN_30DAY_AVG", { n: mMembers })}</i></div>
            <div class="act-sel__stat"><b>${sel.rewards}</b><span>${plural1(sel.rewards, "AN_REWARD_ONE", "AN_REWARD_MANY")}</span><i class="i18n-rtl">${t("AN_30DAY_AVG", { n: mRewards })}</i></div>
          </div>
        </div>
        <div class="act-chart"><span class="act-ymax">${max}</span><div class="act-bars">${bars}</div></div>
        <div class="act-stats">
          <div><b>${data.stamps}</b><span>${t("AN_STAMP_MANY")}</span></div>
          <div><b>${data.members}</b><span>${t("AN_MEMBER_MANY")}</span></div>
          <div><b>${data.rewards}</b><span>${t("AN_REWARD_MANY")}</span></div>
        </div>
        <p class="act-cmp ${cmpCls}">${esc(cmpTxt)}</p>`;
    }

    function renderActivity() {
      const card = $("actCard");
      if (!card || !ACT) return;
      card.innerHTML = activityCardHTML(actPeriod === 30 ? ACT.d30 : ACT.d7);
      card.querySelectorAll(".act-toggle button").forEach((b) => b.onclick = () => { actPeriod = parseInt(b.dataset.p, 10); actSel = null; renderActivity(); });
      card.querySelectorAll(".act-bar").forEach((b) => b.onclick = () => { actSel = b.dataset.date; renderActivity(); });
      const ib = card.querySelector(".info-btn");
      if (ib) ib.onclick = () => { actInfoOpen = !actInfoOpen; card.querySelector(".cb-info").hidden = !actInfoOpen; };
    }

    function setupActivity(activity) { ACT = activity; actPeriod = 7; actSel = null; renderActivity(); }

    async function load() {
      try {
        const cn = localStorage.getItem("loytap_cafe"); if (cn) $("cafeName").textContent = cn;
      } catch (e) {}
      try {
        const res = await fetch(API + "/owner/stats", { method: "POST", headers: { Authorization: token } });
        if (!res.ok) { $("content").innerHTML = `<div class="card glass"><p class="empty">${t("AN_ERR_LOAD_FAILED")}</p></div>`; return; }
        const data = await res.json();
        if (data.cafe) $("cafeName").textContent = data.cafe;
        render(data);
      } catch (e) {
        $("content").innerHTML = `<div class="card glass"><p class="empty">${t("AUTH_ERR_SERVER_UNREACHABLE")}</p></div>`;
      }
    }
    load();
  </script>
</body>
</html>
