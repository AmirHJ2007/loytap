<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>Reloy · Analytics</title>
  <script>try{if(localStorage.getItem('loytap_owner')!=='1')location.replace('auth.html');}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:#171717; --dim:#565656; --faint:#9a9a9a; --line:#cccccc;
      --paper:#f0f0f0; --paper2:#e2e2e2; --bad:#c0503f;
      --ease-spring: cubic-bezier(0.34, 1.4, 0.5, 1);
      --glass-fill: rgba(255,255,255,0.34); --glass-fill-strong: rgba(255,255,255,0.55);
      --glass-border: rgba(255,255,255,0.7); --glass-hi: rgba(255,255,255,0.9);
      --glass-shadow: 0 34px 70px -28px rgba(20,20,20,0.5);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Nunito", system-ui, sans-serif; color: var(--ink);
      background: linear-gradient(165deg, #f5f5f5 0%, #e6e6e6 46%, #d2d2d2 100%);
      min-height: 100dvh; -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }

    /* ---------------- Aurora background ---------------- */
    .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .bg::before, .bg::after { content: ""; position: absolute; border-radius: 50%; filter: blur(72px); opacity: 0.6; will-change: transform; }
    .bg::before { width: 52vmax; height: 52vmax; top: -16vmax; right: -12vmax; background: radial-gradient(circle at 50% 50%, #c4c4c4, transparent 66%); animation: orbA 34s ease-in-out infinite; }
    .bg::after { width: 46vmax; height: 46vmax; bottom: -18vmax; left: -14vmax; background: radial-gradient(circle at 50% 50%, #3a3a3a, transparent 64%); animation: orbB 40s ease-in-out infinite; }
    .stain { position: absolute; border-radius: 50%; filter: blur(66px); opacity: 0.5; will-change: transform; }
    .stain--1 { width: 46vmax; height: 46vmax; top: -10vmax; left: -8vmax; background: radial-gradient(circle at 42% 40%, #d8d8d8, transparent 66%); animation: float1 28s ease-in-out infinite; }
    .stain--2 { width: 42vmax; height: 42vmax; bottom: -12vmax; right: 8vmax; background: radial-gradient(circle at 50% 50%, #808080, transparent 66%); animation: float2 32s ease-in-out infinite; }
    @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(10vmax,6vmax) scale(1.12); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1.05); } 50% { transform: translate(-8vmax,-5vmax) scale(0.94); } }
    @keyframes orbA  { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-9vmax,7vmax) scale(1.14); } }
    @keyframes orbB  { 0%,100% { transform: translate(0,0) scale(1.06); } 50% { transform: translate(7vmax,-6vmax) scale(0.92); } }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .wrap { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 20px 18px 48px; }

    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; animation: fadeDown 0.6s var(--ease-spring) both; }
    .back {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none; cursor: pointer;
      color: var(--dim); font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 13px; border-radius: 12px; padding: 8px 13px;
      background: rgba(255,255,255,0.4); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.5);
      transition: color 0.2s ease, background 0.2s ease;
    }
    .back:hover { color: var(--ink); background: rgba(255,255,255,0.6); }
    .signout {
      color: var(--bad); font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 13px; border-radius: 12px; padding: 8px 13px; cursor: pointer;
      background: linear-gradient(155deg, rgba(253,241,238,0.55), rgba(247,221,214,0.42));
      backdrop-filter: blur(8px); border: 1px solid rgba(192,80,63,0.28);
      transition: background 0.2s ease;
    }
    .signout:hover { background: linear-gradient(155deg, rgba(253,241,238,0.72), rgba(247,221,214,0.58)); }

    .head { margin: 12px 2px 18px; animation: fadeUp 0.6s var(--ease-spring) 0.08s both; }
    .head h1 { font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 26px; margin: 0; letter-spacing: -0.4px; }
    .head p { margin: 3px 0 0; font-size: 14px; color: var(--dim); }

    .loading { text-align: center; color: var(--faint); font-size: 14px; padding: 60px 0; }
    .empty { text-align: center; color: var(--faint); font-size: 13.5px; line-height: 1.6; padding: 30px 16px; }

    /* ---------------- Shared glass surface ---------------- */
    .glass {
      background: linear-gradient(158deg, var(--glass-fill-strong), var(--glass-fill));
      backdrop-filter: blur(20px) saturate(165%); -webkit-backdrop-filter: blur(20px) saturate(165%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi), inset 0 0 0 1px rgba(255,255,255,0.22);
    }

    /* Today pulse — solid black, the hero stat */
    .today-card { background: #171717; color: #ffffff; border-radius: 20px; padding: 16px 18px 18px; margin-bottom: 16px; box-shadow: 0 18px 40px -20px rgba(20,20,20,0.6), inset 0 1px 0 rgba(255,255,255,0.1); animation: cardIn 0.7s var(--ease-spring) 0.14s both; }
    .today-card__h { font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 1.6px; color: rgba(255,255,255,0.6); margin: 0 0 12px; }
    .today-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .today-stat { text-align: center; }
    .today-stat__v { font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 32px; line-height: 1; letter-spacing: -0.5px; }
    .today-stat__k { display: block; margin-top: 6px; font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.65); }

    /* KPI cards — frosted glass */
    .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; animation: cardIn 0.7s var(--ease-spring) 0.2s both; }
    .kpi { border-radius: 18px; padding: 15px 16px; }
    .kpi__v { font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 30px; line-height: 1; color: var(--ink); letter-spacing: -0.5px; }
    .kpi__k { display: block; margin-top: 7px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--faint); }

    /* section cards — frosted glass */
    .card { border-radius: 20px; padding: 18px; margin-bottom: 16px; animation: cardIn 0.7s var(--ease-spring) 0.26s both; }
    .card__title { font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 16px; margin: 0 0 2px; }
    .card__sub { margin: 0 0 14px; font-size: 12px; color: var(--dim); }

    .rings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .ring-card { display: flex; flex-direction: column; align-items: center; text-align: center; background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.5); border-radius: 16px; padding: 16px 12px; }
    .donut { width: 132px; height: 132px; }
    .donut__num { font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 26px; fill: var(--ink); }
    .donut__sub { font-size: 9px; font-weight: 700; letter-spacing: 1px; fill: var(--faint); text-transform: uppercase; }
    .ring-card__t { font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 14px; margin: 8px 0 2px; }
    .ring-card__s { font-size: 12px; color: var(--dim); }

    /* horizontal reward bars */
    .bars { display: flex; flex-direction: column; gap: 12px; }
    .bar-row__top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; gap: 8px; }
    .bar-row__label { font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 14px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-row__val { flex: 0 0 auto; font-size: 12px; font-weight: 700; color: var(--dim); }
    .bar-row__track { position: relative; height: 12px; border-radius: 8px; background: rgba(20,20,20,0.08); overflow: hidden; }
    .bar-row__issued { position: absolute; inset: 0 auto 0 0; height: 100%; background: rgba(20,20,20,0.18); border-radius: 8px; }
    .bar-row__redeemed { position: absolute; inset: 0 auto 0 0; height: 100%; background: #171717; border-radius: 8px; }

    /* stat tiles (at-a-glance) */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat { background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.5); border-radius: 15px; padding: 14px 15px; }
    .stat--warn { border: 1.5px solid rgba(20,20,20,0.35); }
    .stat__v { font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 26px; line-height: 1; color: var(--ink); }
    .stat__k { display: block; margin-top: 6px; font-size: 11.5px; font-weight: 700; color: var(--dim); }
    .stat__s { display: block; margin-top: 2px; font-size: 11px; color: var(--faint); }

    /* daily stamp activity */
    .act-toggle { display: inline-flex; background: rgba(20,20,20,0.07); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 14px; }
    .act-toggle button { border: none; background: transparent; font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 13px; color: var(--dim); padding: 7px 15px; border-radius: 9px; cursor: pointer; }
    .act-toggle button.is-on { background: #fff; color: var(--ink); box-shadow: 0 3px 8px -4px rgba(20,20,20,0.35); }
    .act-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #171717; color: #ffffff; border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; }
    .act-stats b { display: block; font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 28px; line-height: 1; }
    .act-stats span { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 3px; display: block; }
    .act-cmp { margin: 0 2px 14px; font-size: 13px; font-weight: 700; }
    .act-cmp.up { color: var(--ink); } .act-cmp.down { color: var(--bad); } .act-cmp.flat { color: var(--faint); }
    .act-day { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.5); border-radius: 14px; padding: 14px 16px; margin-bottom: 18px; }
    .act-day__l b { font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 16px; }
    .act-day__l span { display: block; font-size: 12.5px; color: var(--dim); margin-top: 2px; }
    .act-day__r { text-align: right; flex: 0 0 auto; }
    .act-day__r b { font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 24px; color: var(--ink); }
    .act-day__r span { display: block; font-size: 11px; color: var(--faint); font-weight: 700; }
    .act-chart { position: relative; padding-top: 14px; }
    .act-ymax { position: absolute; top: 0; left: 0; font-size: 9.5px; font-weight: 700; color: var(--faint); }
    .act-bars { display: flex; align-items: flex-end; gap: 3px; height: 150px; }
    .act-bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; background: none; border: none; padding: 0; cursor: pointer; }
    .act-bar__fill { width: 80%; min-height: 3px; border-radius: 6px 6px 2px 2px; background: rgba(20,20,20,0.18); transition: height 0.3s ease, background 0.2s ease; }
    .act-bar:hover .act-bar__fill { background: rgba(20,20,20,0.32); }
    .act-bar.is-sel .act-bar__fill { background: #171717; }
    .act-bar__lab { font-size: 9px; font-weight: 700; color: var(--faint); white-space: nowrap; }
    .act-bar.is-sel .act-bar__lab { color: var(--ink); }

    /* comeback rate section */
    .info-btn { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-left: 5px; vertical-align: middle; border-radius: 50%; border: 1.5px solid rgba(20,20,20,0.28); background: transparent; color: var(--dim); font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 11px; font-style: italic; line-height: 1; cursor: pointer; padding: 0; transition: color 0.2s ease, border-color 0.2s ease; }
    .info-btn:hover { color: var(--ink); border-color: rgba(20,20,20,0.5); }
    .cb-info { background: rgba(20,20,20,0.05); border-radius: 12px; padding: 11px 13px; font-size: 12.5px; line-height: 1.55; color: var(--dim); margin: 2px 0 12px; }
    .cb-info b { color: var(--ink); }
    .cb-today { display: flex; align-items: center; gap: 14px; margin: 4px 0 12px; }
    .cb-today__v { font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: -1.2px; color: var(--ink); }
    .cb-today__u { font-size: 18px; font-weight: 700; letter-spacing: 0; color: var(--dim); margin-left: 5px; }
    .cb-today__k { font-size: 12px; font-weight: 700; color: var(--dim); }
    .cb-today__k span { display: block; font-weight: 600; color: var(--faint); margin-top: 3px; }
    .cb-chart { margin-top: 4px; }
    .cb-chart svg { width: 100%; height: auto; display: block; overflow: visible; }
    .cb-hit { cursor: pointer; }
    .cb-cap { text-align: center; font-size: 11.5px; color: var(--dim); font-weight: 600; margin: 8px 0 0; }
    .cb-cap b { color: var(--ink); }

    @media (prefers-reduced-motion: reduce) {
      .bg::before, .bg::after, .stain { animation: none; }
      .top, .head, .today-card, .kpis, .card { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="stain stain--1"></span><span class="stain stain--2"></span></div>

  <main class="wrap">
    <div class="top">
      <a class="back" href="owner.html">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Back
      </a>
      <button class="signout" id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <h1>Analytics</h1>
      <p id="cafeName">your café</p>
    </div>

    <div id="content"><p class="loading">Loading your numbers…</p></div>
  </main>

  <script>
    const API = location.port === "8000" ? location.protocol + "//" + location.hostname + ":8090" : location.origin;
    const token = (function () { try { return localStorage.getItem("loytap_token") || ""; } catch (e) { return ""; } })();
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    $("signout").onclick = () => {
      ["loytap_token","loytap_owner","loytap_staff","loytap_role","loytap_signed_in","loytap_name","loytap_cafe"]
        .forEach((k) => { try { localStorage.removeItem(k); } catch (e) {} });
      location.replace("auth.html");
    };

    // ---- SVG donut helper (single-value ring, monochrome) ----
    function ring(pct, sub) {
      const r = 52, c = 2 * Math.PI * r, on = Math.max(0, Math.min(100, pct)) / 100 * c;
      return `<svg viewBox="0 0 130 130" class="donut">
        <circle cx="65" cy="65" r="${r}" fill="none" stroke="rgba(20,20,20,0.08)" stroke-width="14"/>
        <circle cx="65" cy="65" r="${r}" fill="none" stroke="#171717" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="${on.toFixed(1)} ${(c - on).toFixed(1)}" transform="rotate(-90 65 65)"/>
        <text x="65" y="66" text-anchor="middle" class="donut__num">${pct}%</text>
        <text x="65" y="84" text-anchor="middle" class="donut__sub">${esc(sub)}</text>
      </svg>`;
    }

    function render(d) {
      const t = d.totals, r = d.rates;
      if (!t.customers && !t.issued) {
        $("content").innerHTML = `<div class="card glass"><p class="empty">No data yet.<br/>Once customers start collecting stamps and earning rewards, your analytics will appear here.</p></div>`;
        return;
      }

      // KPI cards
      const kpis = [
        [t.customers, "Customers"],
        ["+" + t.newCustomers, "New · 14 days"],
        [t.cardsCompleted, "Cards completed"],
        [t.redeemed, "Rewards redeemed"],
      ].map((k) => `<div class="kpi glass"><div class="kpi__v">${k[0]}</div><span class="kpi__k">${k[1]}</span></div>`).join("");

      // reward bars
      const maxIssued = Math.max(1, ...d.byDeal.map((x) => x.issued));
      const bars = d.byDeal.length ? d.byDeal.map((x) => {
        const issuedW = (x.issued / maxIssued) * 100;
        const redeemedW = (x.redeemed / maxIssued) * 100;
        return `<div class="bar-row">
          <div class="bar-row__top"><span class="bar-row__label">${esc(x.deal)}</span><span class="bar-row__val">${x.redeemed} used · ${x.issued} won</span></div>
          <div class="bar-row__track"><div class="bar-row__issued" style="width:${issuedW}%"></div><div class="bar-row__redeemed" style="width:${redeemedW}%"></div></div>
        </div>`;
      }).join("") : `<p class="empty">No rewards defined yet.</p>`;

      const today = d.today || { members: 0, stamps: 0, rewards: 0 };

      $("content").innerHTML = `
        <div class="today-card">
          <p class="today-card__h">Today</p>
          <div class="today-grid">
            <div class="today-stat"><div class="today-stat__v">${today.members}</div><span class="today-stat__k">New members</span></div>
            <div class="today-stat"><div class="today-stat__v">${today.stamps}</div><span class="today-stat__k">Stamps</span></div>
            <div class="today-stat"><div class="today-stat__v">${today.rewards}</div><span class="today-stat__k">Rewards</span></div>
          </div>
        </div>

        <div class="kpis">${kpis}</div>

        <div class="card glass" id="cbCard"></div>

        <div class="card glass" id="vrCard"></div>

        <div class="card glass">
          <h2 class="card__title">Loyalty</h2>
          <p class="card__sub">Are customers coming back to finish their card?</p>
          <div class="rings">
            <div class="ring-card">${ring(r.comeback, "finished")}<span class="ring-card__t">Card completion</span><span class="ring-card__s">${t.returning} of ${t.customers} completed a card · ${t.repeat} repeat</span></div>
            <div class="ring-card">${ring(r.redemption, "redeemed")}<span class="ring-card__t">Redemption rate</span><span class="ring-card__s">${t.redeemed30} of ${t.issued30} claimed · last 30 days</span></div>
          </div>
        </div>

        <div class="card glass">
          <h2 class="card__title">At a glance</h2>
          <p class="card__sub">What needs attention right now</p>
          <div class="stat-grid">
            <div class="stat stat--warn"><div class="stat__v">${t.expiringSoon}</div><span class="stat__k">Rewards expiring soon</span><span class="stat__s">active, due within 7 days</span></div>
            <div class="stat"><div class="stat__v">${t.inProgress}</div><span class="stat__k">Cards in progress</span><span class="stat__s">customers collecting now</span></div>
            <div class="stat"><div class="stat__v">${t.avgStamps}</div><span class="stat__k">Avg stamps / customer</span><span class="stat__s">overall engagement</span></div>
            <div class="stat"><div class="stat__v">${t.expired}</div><span class="stat__k">Rewards expired unused</span><span class="stat__s">never claimed</span></div>
          </div>
        </div>

        <div class="card glass">
          <h2 class="card__title">Most-used rewards</h2>
          <p class="card__sub">Which prizes your customers claim · last 30 days</p>
          <div class="bars">${bars}</div>
        </div>

        <div class="card glass" id="actCard"></div>`;

      if (d.comeback) setupComeback(d.comeback);
      if (d.visitRhythm) setupVisitRhythm(d.visitRhythm);
      if (d.activity) setupActivity(d.activity);
    }

    // ---- comeback rate: today's number + a 14-day line chart ----
    function cbLineChart(series) {
      const W = 320, H = 132, padL = 6, padR = 6, padT = 10, padB = 20;
      const n = series.length, iw = W - padL - padR, ih = H - padT - padB;
      const X = (i) => padL + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
      const Y = (v) => padT + ih - (Math.max(0, Math.min(100, v)) / 100) * ih;
      const pts = series.map((s, i) => [X(i), Y(s.rate)]);
      const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      const area = path + " L" + X(n - 1).toFixed(1) + " " + (padT + ih).toFixed(1) + " L" + X(0).toFixed(1) + " " + (padT + ih).toFixed(1) + " Z";
      const grid = [0, 50, 100].map((v) => {
        const y = Y(v).toFixed(1);
        return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="rgba(20,20,20,0.08)" stroke-width="1"/>`
          + `<text x="${W - padR}" y="${(Y(v) - 3).toFixed(1)}" text-anchor="end" font-size="8.5" font-weight="700" fill="var(--faint)">${v}%</text>`;
      }).join("");
      const dots = pts.map((p, i) => {
        const last = i === n - 1;
        return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last ? 3.4 : 2}" fill="${last ? "#171717" : "rgba(20,20,20,0.55)"}"/>`
          + `<circle class="cb-hit" data-i="${i}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="11" fill="transparent"><title>${esc(series[i].label)}: ${series[i].rate}%</title></circle>`;
      }).join("");
      const xi = [0, Math.floor((n - 1) / 2), n - 1];
      const xlab = xi.map((i) =>
        `<text x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}" font-size="8.5" font-weight="700" fill="var(--faint)">${esc(series[i].label)}</text>`
      ).join("");
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Comeback rate, last 14 days">
        ${grid}
        <path d="${area}" fill="rgba(20,20,20,0.07)"/>
        <path d="${path}" fill="none" stroke="#171717" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}${xlab}
      </svg>`;
    }

    function setupComeback(cb) {
      const card = $("cbCard");
      const s = cb.series || [];
      if (!s.length) { card.remove(); return; }
      const last = s[s.length - 1];
      card.innerHTML = `
        <h2 class="card__title">Comeback rate <button class="info-btn" type="button" aria-label="What does this mean?">i</button></h2>
        <p class="card__sub">New members who returned to stamp again · ${cb.windowDays}-day window</p>
        <div class="cb-info" hidden>
          Of everyone who earned their <b>first</b> stamp here during the ${cb.windowDays} days ending on a date, this is the share who came back and stamped <b>at least once more</b> within that same ${cb.windowDays}-day window. It’s a fresh-customer retention signal — higher means new visitors are becoming regulars instead of trying you once and leaving. The line shows how that rate moved over the last 14 days.
        </div>
        <div class="cb-today">
          <div class="cb-today__v">${last.rate}%</div>
          <div class="cb-today__k">today · last ${cb.windowDays} days<span>${last.returners} of ${last.newMembers} new members came back</span></div>
        </div>
        <div class="cb-chart">${cbLineChart(s)}</div>
        <p class="cb-cap" id="cbCap"></p>`;
      const info = card.querySelector(".cb-info");
      card.querySelector(".info-btn").onclick = () => { info.hidden = !info.hidden; };
      const cap = $("cbCap");
      const setCap = (i) => { const x = s[i]; cap.innerHTML = `${cb.windowDays} days ending <b>${esc(x.label)}</b> · ${x.rate}% — ${x.returners}/${x.newMembers} new members returned`; };
      setCap(s.length - 1);
      card.querySelectorAll(".cb-hit").forEach((el) => el.onclick = () => setCap(+el.dataset.i));
    }

    // ---- visit rhythm: median gap between visits + a 14-day line chart ----
    function vrLineChart(series) {
      const vals = series.map((s) => s.value).filter((v) => v != null);
      if (!vals.length) return `<p class="empty">Not enough repeat visits yet to measure a rhythm.</p>`;
      const W = 320, H = 132, padL = 6, padR = 6, padT = 10, padB = 20;
      const n = series.length, iw = W - padL - padR, ih = H - padT - padB;
      let maxV = Math.max(...vals); if (maxV <= 0) maxV = 1;
      const step = maxV <= 5 ? 1 : (maxV <= 10 ? 2 : (maxV <= 30 ? 5 : 10));
      const yMax = Math.max(step, Math.ceil(maxV / step) * step);
      const X = (i) => padL + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
      const Y = (v) => padT + ih - (Math.max(0, Math.min(yMax, v)) / yMax) * ih;
      let path = "", pen = false;
      series.forEach((s, i) => { if (s.value == null) { pen = false; return; } path += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(s.value).toFixed(1) + " "; pen = true; });
      const fmtY = (v) => (v % 1 ? v.toFixed(1) : v) + "d";
      const grid = [0, yMax / 2, yMax].map((v) => {
        const y = Y(v).toFixed(1);
        return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="rgba(20,20,20,0.08)" stroke-width="1"/>`
          + `<text x="${W - padR}" y="${(Y(v) - 3).toFixed(1)}" text-anchor="end" font-size="8.5" font-weight="700" fill="var(--faint)">${fmtY(v)}</text>`;
      }).join("");
      const dots = series.map((s, i) => {
        if (s.value == null) return "";
        const last = i === n - 1;
        return `<circle cx="${X(i).toFixed(1)}" cy="${Y(s.value).toFixed(1)}" r="${last ? 3.4 : 2}" fill="${last ? "#171717" : "rgba(20,20,20,0.55)"}"/>`
          + `<circle class="vr-hit" data-i="${i}" cx="${X(i).toFixed(1)}" cy="${Y(s.value).toFixed(1)}" r="11" fill="transparent"><title>${esc(s.label)}: ${s.value}d</title></circle>`;
      }).join("");
      const xi = [0, Math.floor((n - 1) / 2), n - 1];
      const xlab = xi.map((i) =>
        `<text x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}" font-size="8.5" font-weight="700" fill="var(--faint)">${esc(series[i].label)}</text>`
      ).join("");
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visit rhythm, last 14 days">
        ${grid}
        <path d="${path.trim()}" fill="none" stroke="#171717" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}${xlab}
      </svg>`;
    }

    function setupVisitRhythm(vr) {
      const card = $("vrCard");
      const s = vr.series || [];
      if (!s.length) { card.remove(); return; }
      const last = s[s.length - 1];
      const unit = (v) => v === 1 ? "day" : "days";
      card.innerHTML = `
        <h2 class="card__title">Visit rhythm <button class="info-btn" type="button" aria-label="What does this mean?">i</button></h2>
        <p class="card__sub">How often a returning customer comes back · ${vr.windowDays}-day window</p>
        <div class="cb-info" hidden>
          Among customers who stamped <b>more than once</b> in the ${vr.windowDays} days ending on a date, we take each person’s <b>average gap</b> between their own consecutive stamps, then report the <b>median</b> of those averages. So “4 days” means a typical returning customer comes back roughly every 4 days. <b>Lower is better</b> — people are visiting more often. The line shows how that pace moved over the last 14 days.
        </div>
        <div class="cb-today">
          <div class="cb-today__v">${last.value == null ? "—" : last.value}${last.value == null ? "" : `<span class="cb-today__u">${unit(last.value)}</span>`}</div>
          <div class="cb-today__k">today · last ${vr.windowDays} days<span>${last.customers} repeat customer${last.customers === 1 ? "" : "s"} measured</span></div>
        </div>
        <div class="cb-chart">${vrLineChart(s)}</div>
        <p class="cb-cap" id="vrCap"></p>`;
      const info = card.querySelector(".cb-info");
      card.querySelector(".info-btn").onclick = () => { info.hidden = !info.hidden; };
      const cap = $("vrCap");
      const setCap = (i) => {
        const x = s[i];
        cap.innerHTML = x.value == null
          ? `${vr.windowDays} days ending <b>${esc(x.label)}</b> · not enough repeat visits`
          : `${vr.windowDays} days ending <b>${esc(x.label)}</b> · ${x.value} ${unit(x.value)} between visits — ${x.customers} repeat customer${x.customers === 1 ? "" : "s"}`;
      };
      setCap(s.length - 1);
      card.querySelectorAll(".vr-hit").forEach((el) => el.onclick = () => setCap(+el.dataset.i));
    }

    // ---- interactive daily stamp activity card ----
    let ACT = null, actPeriod = 7, actSel = null;
    const plural = (n) => (n === 1 ? "" : "s");

    function activityCardHTML(data) {
      if (!actSel || !data.days.some((x) => x.date === actSel)) actSel = data.days[data.days.length - 1].date;
      const sel = data.days.find((x) => x.date === actSel) || { label: "—", stamps: 0, members: 0, rewards: 0 };
      let cmpCls = "flat", cmpTxt;
      if (data.prevStamps > 0) {
        const chg = Math.round((data.stamps - data.prevStamps) / data.prevStamps * 100);
        cmpCls = chg > 0 ? "up" : (chg < 0 ? "down" : "flat");
        cmpTxt = "Stamps " + (chg > 0 ? "+" : "") + chg + "% vs previous " + actPeriod + " days";
      } else {
        cmpTxt = data.stamps > 0 ? "First activity in this window" : "No stamps yet in this window";
      }
      const max = Math.max(1, ...data.days.map((x) => x.stamps));
      const bars = data.days.map((x, i) => {
        const h = (x.stamps / max * 100).toFixed(1);
        let lab = actPeriod === 7 ? x.dow : ((i % 5 === 0 || i === data.days.length - 1) ? x.date.slice(8) : "");
        return `<button class="act-bar${x.date === actSel ? " is-sel" : ""}" data-date="${x.date}" title="${esc(x.label)}"><span class="act-bar__fill" style="height:${h}%"></span><span class="act-bar__lab">${esc(lab)}</span></button>`;
      }).join("");
      return `
        <h2 class="card__title">Daily stamp activity</h2>
        <p class="card__sub">Select a day to see its visits and rewards</p>
        <div class="act-toggle">
          <button data-p="7" class="${actPeriod === 7 ? "is-on" : ""}">7 days</button>
          <button data-p="30" class="${actPeriod === 30 ? "is-on" : ""}">30 days</button>
        </div>
        <div class="act-stats">
          <div><b>${data.stamps}</b><span>Stamps</span></div>
          <div><b>${data.members}</b><span>Members</span></div>
          <div><b>${data.rewards}</b><span>Rewards</span></div>
        </div>
        <p class="act-cmp ${cmpCls}">${esc(cmpTxt)}</p>
        <div class="act-day">
          <div class="act-day__l"><b>${esc(sel.label)}</b><span>${sel.stamps} stamp${plural(sel.stamps)} from ${sel.members} member${plural(sel.members)}</span></div>
          <div class="act-day__r"><b>${sel.rewards}</b><span>Rewards</span></div>
        </div>
        <div class="act-chart"><span class="act-ymax">${max}</span><div class="act-bars">${bars}</div></div>`;
    }

    function renderActivity() {
      const card = $("actCard");
      if (!card || !ACT) return;
      card.innerHTML = activityCardHTML(actPeriod === 30 ? ACT.d30 : ACT.d7);
      card.querySelectorAll(".act-toggle button").forEach((b) => b.onclick = () => { actPeriod = parseInt(b.dataset.p, 10); actSel = null; renderActivity(); });
      card.querySelectorAll(".act-bar").forEach((b) => b.onclick = () => { actSel = b.dataset.date; renderActivity(); });
    }

    function setupActivity(activity) { ACT = activity; actPeriod = 7; actSel = null; renderActivity(); }

    async function load() {
      try {
        const cn = localStorage.getItem("loytap_cafe"); if (cn) $("cafeName").textContent = cn;
      } catch (e) {}
      try {
        const res = await fetch(API + "/owner/stats", { method: "POST", headers: { Authorization: token } });
        if (!res.ok) { $("content").innerHTML = `<div class="card glass"><p class="empty">Couldn’t load analytics — please sign in again as the café owner.</p></div>`; return; }
        const data = await res.json();
        if (data.cafe) $("cafeName").textContent = data.cafe;
        render(data);
      } catch (e) {
        $("content").innerHTML = `<div class="card glass"><p class="empty">Cannot reach the server.</p></div>`;
      }
    }
    load();
  </script>
</body>
</html>
