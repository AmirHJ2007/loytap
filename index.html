<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>LoyTap · Loyalty Wallet</title>
  <script>try{if(localStorage.getItem('loytap_signed_in')!=='1'){var _t=new URLSearchParams(location.search).get('t');if(_t)localStorage.setItem('reloy_pending_tap',JSON.stringify({code:_t,at:Date.now()}));location.replace('auth.html');}}catch(e){}</script>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css?v=56" />
</head>
<body>
  <!-- Hidden SVG defs: rough-ink filter reused by every stamped star -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="roughInk" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="bg" aria-hidden="true">
    <span class="stain stain--1"></span>
    <span class="stain stain--2"></span>
    <span class="grain"></span>
  </div>

  <button class="signout-btn" id="signoutBtn" aria-label="Sign out" title="Sign out">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <path d="M16 17l5-5-5-5"/>
      <path d="M21 12H9"/>
    </svg>
  </button>

  <button class="wallet-close" id="walletClose" type="button" aria-label="Back to wallet" hidden>✕</button>

  <main class="stage">
    <p class="greeting" id="greeting">Welcome back 👋</p>
    <div class="wallet" id="wallet"></div>
  </main>

  <!-- Stamp button, pinned to the bottom of the screen -->
  <div class="stampbar">
    <button class="btn btn--primary stampbar__btn" id="stampFab" type="button"><span class="btn__label">Stamp</span></button>
  </div>

  <!-- The shared rubber stamp tool that flies in and presses down -->
  <div class="stamper" id="stamper" aria-hidden="true">
    <svg viewBox="0 0 120 150" width="120" height="150">
      <defs>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a9713f"/><stop offset="0.5" stop-color="#8a5628"/><stop offset="1" stop-color="#6e401d"/>
        </linearGradient>
        <linearGradient id="woodDark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7d4c24"/><stop offset="1" stop-color="#5c3417"/>
        </linearGradient>
        <linearGradient id="rubber" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4a2f20"/><stop offset="1" stop-color="#2c1a10"/>
        </linearGradient>
      </defs>
      <ellipse class="stamper__shadow" cx="60" cy="132" rx="40" ry="8" fill="rgba(60,35,15,0.28)"/>
      <ellipse cx="60" cy="24" rx="30" ry="18" fill="url(#wood)"/>
      <ellipse cx="52" cy="19" rx="12" ry="6" fill="rgba(255,240,220,0.35)"/>
      <rect x="49" y="34" width="22" height="20" rx="6" fill="url(#woodDark)"/>
      <rect x="24" y="50" width="72" height="24" rx="9" fill="url(#wood)"/>
      <rect x="24" y="50" width="72" height="8" rx="4" fill="rgba(255,240,220,0.22)"/>
      <rect x="18" y="72" width="84" height="46" rx="12" fill="url(#rubber)"/>
      <path d="M60 84 L64.5 96 L77 96 L67 104 L70.5 116 L60 108.5 L49.5 116 L53 104 L43 96 L55.5 96 Z" fill="rgba(190,120,70,0.55)"/>
    </svg>
  </div>

  <!-- Discounts pocket -->
  <button class="pocket-btn" id="pocketBtn" aria-label="My discounts" title="My discounts">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 8.5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2 1.5 1.5 0 0 0 0 3v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a1.5 1.5 0 0 0 0-3Z"/>
      <path d="M14 6.5v11" stroke-dasharray="1.5 2"/>
    </svg>
    <span class="pocket-badge" id="pocketBadge" hidden>0</span>
  </button>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="My discounts">
    <div class="drawer__grip" aria-hidden="true"></div>
    <header class="drawer__head">
      <button class="drawer__back" id="drawerBack" aria-label="Back" hidden>‹</button>
      <h2 class="drawer__title" id="drawerTitle">My Cafés</h2>
      <button class="drawer__close" id="drawerClose" aria-label="Close">✕</button>
    </header>
    <div class="drawer__list" id="drawerList">
      <p class="drawer__empty" id="drawerEmpty">No discounts yet.<br/>Fill a card to earn one.</p>
    </div>
  </aside>

  <!-- Congratulation ticket -->
  <div class="congrats" id="congrats" hidden aria-hidden="true">
    <div class="ticket">
      <div class="ticket__pop">🎉</div>
      <h2 class="ticket__title">Congratulation!</h2>
      <p class="ticket__sub" id="congratsSub">Show this screen to the staff to claim your reward</p>
      <div class="ticket__divider"></div>
      <div class="ticket__stats">
        <div><span class="ticket__k">Discount</span><span class="ticket__v" id="ticketDiscount">—</span></div>
        <div><span class="ticket__k">Due date</span><span class="ticket__v" id="ticketDue">—</span></div>
        <div><span class="ticket__k">One time</span><span class="ticket__v" id="ticketOnce">Yes</span></div>
      </div>
      <div class="ticket__divider"></div>
      <div class="ticket__qr" id="ticketQr"></div>
      <p class="ticket__hint" id="ticketHint">Show this QR to the staff</p>
      <p class="ticket__code" id="ticketCode">—</p>
      <div class="ticket__used" id="ticketUsed" hidden><span class="ticket__usedmark">Used</span></div>
    </div>
    <button class="congrats__continue" id="congratsContinue" type="button">Continue</button>
  </div>

  <!-- Settings bottom sheet -->
  <aside class="sheet" id="settings" aria-hidden="true" aria-label="Settings">
    <div class="sheet__grip" aria-hidden="true"></div>
    <h2 class="sheet__title">Settings</h2>
    <div class="sheet__rows">
      <div class="srow"><span class="srow__k">Name</span><span class="srow__v" id="setName">—</span></div>
      <div class="srow"><span class="srow__k">Phone</span><span class="srow__v" id="setPhone">—</span></div>
      <div class="srow"><span class="srow__k">Version</span><span class="srow__v">Reloy 1.0</span></div>
    </div>
    <button class="sheet__signout" id="setSignout" type="button">Sign out</button>
  </aside>

  <!-- Glassy bottom navigation -->
  <nav class="tabbar" id="tabbar" style="--ti:1" aria-label="Primary">
    <span class="tabbar__ind" aria-hidden="true"></span>
    <button class="tab" id="tabDiscounts" type="button" aria-label="Discounts">
      <span class="tab__ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0l-8-8V3.6a1 1 0 0 1 1-1H12l8.6 8.6a2 2 0 0 1 0 2.2z"/><circle cx="7.6" cy="7.6" r="1.1" fill="currentColor" stroke="none"/></svg>
        <span class="tab__badge" id="tabBadge" hidden>0</span>
      </span>
      <span class="tab__label">Discounts</span>
    </button>
    <button class="tab is-active" id="tabWallet" type="button" aria-label="Wallet">
      <span class="tab__ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1"/><path d="M21 8.5h-5a2.5 2.5 0 0 0 0 5h5a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1z"/></svg>
      </span>
      <span class="tab__label">Wallet</span>
    </button>
    <button class="tab" id="tabSettings" type="button" aria-label="Settings">
      <span class="tab__ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.1" fill="none"/><circle cx="15" cy="12" r="2.1" fill="none"/><circle cx="8" cy="17" r="2.1" fill="none"/></svg>
      </span>
      <span class="tab__label">Settings</span>
    </button>
  </nav>

  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <script src="qrcode.js"></script>
  <script src="app.js?v=45"></script>
</body>
</html>
