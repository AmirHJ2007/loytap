<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>Reloy · Sign in</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="reloy-icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Reloy" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="auth.css?v=35" />
  <script src="i18n.js?v=7"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="stain stain--1"></span><span class="stain stain--2"></span></div>

  <main class="auth">
    <div class="auth__card">
      <div class="card-sheen" aria-hidden="true"></div>
      <div class="toast" id="toast" hidden>
        <span class="toast__icon">🙁</span>
        <div class="toast__body">
          <b class="toast__title" data-i18n="AUTH_TOAST_NOT_REGISTERED_TITLE">Not registered yet</b>
          <span class="toast__msg" id="toastMsg"></span>
        </div>
      </div>
      <div class="lang-switch" id="langSwitch" role="tablist" aria-label="Language">
        <button class="lang-switch__btn" data-lang="en" type="button" data-i18n="LANG_EN">English</button>
        <button class="lang-switch__btn" data-lang="fa" type="button" data-i18n="LANG_FA">فارسی</button>
      </div>
      <h1 class="auth__brand"><img src="reloy-logo.png?v=2" alt="Reloy" /></h1>

      <!-- STEP 1: phone -->
      <section class="step" id="stepPhone">
        <div class="tabs" id="modeTabs">
          <button class="tabs__btn is-on" data-mode="signin" type="button" data-i18n="AUTH_TAB_SIGNIN">Sign in</button>
          <button class="tabs__btn" data-mode="register" type="button" data-i18n="AUTH_TAB_REGISTER">Register</button>
        </div>

        <div class="field" id="fieldName" hidden>
          <label for="name" data-i18n="AUTH_LABEL_NAME">What can we call you?</label>
          <input id="name" type="text" autocomplete="name" placeholder="e.g. Sara" data-i18n-placeholder="AUTH_PH_NAME" />
        </div>

        <div class="field">
          <label for="phone" data-i18n="AUTH_LABEL_PHONE">Mobile number</label>
          <div class="phone">
            <span class="phone__cc">🇮🇷 +98</span>
            <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="912 345 6789" data-i18n-placeholder="AUTH_PH_PHONE" />
          </div>
          <p class="field__err" id="phoneErr" hidden data-i18n="AUTH_ERR_PHONE">Enter a valid Iranian mobile number.</p>
        </div>

        <button class="btn btn--primary" id="sendBtn" type="button" data-i18n="AUTH_BTN_SEND">Send code</button>
        <p class="fine" data-i18n-html="AUTH_TERMS_LINE">By continuing you agree to our <a href="terms.html">Terms</a> &amp; <a href="terms.html">Privacy</a>.</p>
        <button class="link-btn" id="businessLink" type="button" data-i18n="AUTH_LINK_ARE_YOU_BUSINESS">Are you a business?</button>
      </section>

      <!-- STEP 2: otp -->
      <section class="step" id="stepOtp" hidden>
        <button class="back" id="backBtn" type="button" data-i18n="AUTH_CHANGE_NUMBER">← Change number</button>
        <p class="step__title" data-i18n="AUTH_OTP_TITLE">Enter the code</p>
        <p class="step__sub"><span data-i18n="AUTH_OTP_SENT_TO">We sent a 6-digit code to</span> <b id="otpPhone">+98 …</b></p>
        <div class="otp" id="otp">
          <input inputmode="numeric" maxlength="1" aria-label="Digit 1" />
          <input inputmode="numeric" maxlength="1" aria-label="Digit 2" />
          <input inputmode="numeric" maxlength="1" aria-label="Digit 3" />
          <input inputmode="numeric" maxlength="1" aria-label="Digit 4" />
          <input inputmode="numeric" maxlength="1" aria-label="Digit 5" />
          <input inputmode="numeric" maxlength="1" aria-label="Digit 6" />
        </div>
        <p class="field__err" id="otpErr" hidden data-i18n="AUTH_OTP_ERR_INCOMPLETE">Please enter all 6 digits.</p>
        <button class="btn btn--primary" id="verifyBtn" type="button" data-i18n="AUTH_BTN_VERIFY">Verify</button>
        <p class="resend" id="resend">Resend code in <b id="resendT">60</b>s</p>
        <p class="fine demo" data-i18n="AUTH_DEV_NOTE">Dev mode: no SMS yet — the code is filled in for you.</p>
      </section>

      <!-- STEP 3: done -->
      <section class="step" id="stepDone" hidden>
        <div class="done__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <p class="step__title" id="doneTitle" data-i18n="AUTH_DONE_TITLE_DEFAULT">You're in!</p>
        <p class="step__sub" id="doneSub"></p>
        <a class="btn btn--primary" id="continueBtn" href="index.html" data-i18n="AUTH_CONTINUE">Continue</a>
      </section>
    </div>
  </main>

  <script src="auth.js?v=24"></script>
</body>
</html>
